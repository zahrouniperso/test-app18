<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Finding Shantanu</title>
  <link rel="stylesheet" href="style.css?v=012">
</head>
<body>
  <!-- Client/UI layer: page shell, canvas mount point, and touch controls -->
  <div class="stage">
    <div class="game-frame">
      <canvas id="game" width="960" height="540"></canvas>

      <!-- Always-visible pause toggle (mouse and touch) -->
      <button class="pause-btn" id="pauseBtn" aria-label="Pause or resume">&#10073;&#10073;</button>

      <!-- Name entry overlay: real HTML input, shown only during the
           'nameEntry' game state (see game.js). The canvas draws a
           matching dimmed background behind it. -->
      <div class="overlay-panel ui-hidden" id="nameEntryPanel">
        <label for="nameInput">What should we call you?</label>
        <input id="nameInput" type="text" maxlength="16" autocomplete="off" placeholder="Your name">
        <button id="nameSubmitBtn" class="overlay-btn" type="button">Continue</button>
      </div>

      <!-- Character select overlay: shown only during the 'characterSelect'
           game state, right after name entry. -->
      <div class="overlay-panel ui-hidden" id="characterSelectPanel">
        <label>Choose your character</label>
        <div class="character-choices">
          <button class="character-card" id="chooseMale" type="button">
            <img src="assets/images/preview-male.png" alt="Male character">
            <span>Male</span>
          </button>
          <button class="character-card" id="chooseFemale" type="button">
            <img src="assets/images/preview-female.png" alt="Female character">
            <span>Female</span>
          </button>
        </div>
      </div>

      <!-- On-screen touch controls (mobile) -->
      <div class="touch-controls" id="touchControls">
        <div class="touch-side">
          <button class="touch-btn" id="btnLeft" aria-label="Move left">&#8592;</button>
          <button class="touch-btn" id="btnRight" aria-label="Move right">&#8594;</button>
        </div>
        <div class="touch-side">
          <button class="touch-btn touch-jump" id="btnJump" aria-label="Jump">&#8593;</button>
        </div>
      </div>
    </div>

    <!-- Shown on narrow/portrait mobile viewports instead of the game -->
    <div class="rotate-message" id="rotateMessage">
      <p>Please rotate your device to landscape to play.</p>
    </div>
  </div>

  <script src="game.js?v=012"></script>
</body>
</html>
